name: Framework Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  framework-checks:
    name: Framework Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out shared history-privacy control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GLOBAL-AI-GOVERNANCE/.github
          ref: 201113e1fdf92892ab8864abe8ae446bb2a9109b
          path: .gaig-shared-controls
          sparse-checkout: tools/check_history_privacy.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check reachable history privacy
        run: python3 -B .gaig-shared-controls/tools/check_history_privacy.py
      - name: Remove shared history-privacy control
        if: always()
        run: rm -rf -- .gaig-shared-controls

      - name: Install hash-locked schema validation engine
        run: |
          python3 -m venv "${RUNNER_TEMP}/schema-venv"
          "${RUNNER_TEMP}/schema-venv/bin/python" -m pip install --require-hashes --no-deps -r requirements-schema.lock
          echo "${RUNNER_TEMP}/schema-venv/bin" >> "${GITHUB_PATH}"

      - name: Validate schemas with standard Draft 2020-12 engine
        run: |
          python3 -B tools/validate_schemas_standard.py

      - name: Validate public framework
        run: |
          python3 -B tools/validate_framework.py

      - name: Validate continuous assurance reference
        run: |
          python3 -B tools/validate_assurance.py examples/secure-inference-cell/reference-bundle.json

      - name: Run continuous assurance regressions
        env:
          ACRF_REQUIRE_STANDARD_SCHEMA: "1"
        run: |
          python3 -m unittest discover -s tests -v
